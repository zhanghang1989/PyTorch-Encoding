# Runs the unit tests on the self-hosted runner (needs CUDA — tests use
# torch.cuda.DoubleTensor / .cuda()).
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unit Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up conda PATH
        run: echo "/home/ubuntu/anaconda3/bin:/usr/local/bin:/usr/bin:/bin" >> $GITHUB_PATH

      - name: Install package
        # --no-build-isolation so setup.py can `import torch` at build time
        # (torch is already installed in the self-hosted conda env).
        run: |
          python -m pip install --upgrade pip
          pip install --no-build-isolation -e .

      - name: Run pytest
        run: |
          pip install pytest
          pytest -v tests/unit_test/
